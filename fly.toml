# fly.io configuration for findajob.
#
# See https://fly.io/docs/reference/configuration/

app = 'findajob'
primary_region = 'fra'

[build]

[env]
  ASPNETCORE_ENVIRONMENT = 'Production'

# The SQLite database and all user uploads live on this volume. Without it every
# deploy replaced the container filesystem and took the data with it.
#
# Create it once with:
#   fly volumes create findajob_data --region fra --size 1
[mounts]
  source = 'findajob_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # A single machine, because SQLite on a volume cannot be shared between them.
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '20s'
    interval = '30s'
    method = 'GET'
    timeout = '5s'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
